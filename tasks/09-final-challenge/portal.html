<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management Portal | Capstone API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-title h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .server-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    /* Stats Bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
    }

    .icon-blue {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .icon-green {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .icon-purple {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }

    .stat-info h3 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-info span {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 16px 12px 42px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* Student Grid */
    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .student-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .student-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
      border-color: #475569;
    }

    .student-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .student-title h4 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .student-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .course-badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    .card-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 0.85rem;
      flex: 1;
      justify-content: center;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .btn-edit {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .btn-edit:hover {
      background: var(--warning);
      color: white;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      font-size: 0.9rem;
    }

    .toast.show {
      display: flex;
      animation: slideIn 0.3s forwards;
    }

    @keyframes slideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal h3 {
      margin-bottom: 16px;
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-cancel:hover {
      color: var(--text-main);
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="header-title">
        <h1>Student Management Portal</h1>

      </div>

    </header>

    <!-- Stats Bar -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon icon-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="stat-info">
          <h3 id="stat-total">0</h3>
          <span>Total Students</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-green">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="stat-info">
          <h3 id="stat-cse">0</h3>
          <span>CSE Department</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <rect x="9" y="9" width="6" height="6"></rect>
            <line x1="9" y1="1" x2="9" y2="4"></line>
            <line x1="15" y1="1" x2="15" y2="4"></line>
            <line x1="9" y1="20" x2="9" y2="23"></line>
            <line x1="15" y1="20" x2="15" y2="23"></line>
            <line x1="20" y1="9" x2="23" y2="9"></line>
            <line x1="20" y1="15" x2="23" y2="15"></line>
            <line x1="1" y1="9" x2="4" y2="9"></line>
            <line x1="1" y1="15" x2="4" y2="15"></line>
          </svg>
        </div>
        <div class="stat-info">
          <h3 id="stat-other">0</h3>
          <span>ECE / Other</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <div class="search-box">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Search by student name or course (case-insensitive)..."
          oninput="handleSearch()">
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add New Student
      </button>
    </div>

    <!-- Students Grid -->
    <div class="students-grid" id="students-grid">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">Add New Student</h3>
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label>Student Full Name</label>
        <input type="text" id="student-name" placeholder="e.g. Vikramaditya Sharma">
      </div>
      <div class="form-group">
        <label>Department / Course</label>
        <input type="text" id="student-course" placeholder="e.g. CSE or ECE or AIML">
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveStudent()">Save Student</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span id="toast-icon">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </span>
    <span id="toast-msg">Action performed!</span>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    let currentStudents = [];

    async function loadStudents(searchTerm = '') {
      try {
        const url = searchTerm ? `${API_BASE}/students?search=${encodeURIComponent(searchTerm)}` : `${API_BASE}/students`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('API request failed');
        const data = await res.json();
        currentStudents = data;
        renderStudents(data);
        updateStats();
      } catch (err) {
        document.getElementById('students-grid').innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8; background: #1e293b; border-radius: 12px;">
             Could not connect to Express Server at <b>${API_BASE}</b>.<br>
            Please ensure <code>node tasks/09-final-challenge/server.js</code> is running!
          </div>
        `;
      }
    }

    function renderStudents(students) {
      const grid = document.getElementById('students-grid');
      if (students.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8; background: #1e293b; border-radius: 12px;">
            No students found matching your criteria.
          </div>
        `;
        return;
      }
      grid.innerHTML = students.map(s => {
        const initials = s.name ? s.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase() : 'ST';
        return `
          <div class="student-card">
            <div>
              <div class="student-header">
                <div class="avatar">${initials}</div>
                <div class="student-title">
                  <h4>${escapeHtml(s.name)}</h4>
                  <span class="student-id">ID: #${s.id}</span>
                </div>
              </div>
              <span class="course-badge">${escapeHtml(s.course)}</span>
            </div>
            <div class="card-actions">
              <button class="btn btn-sm btn-edit" onclick="openEditModal(${s.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Edit
              </button>
              <button class="btn btn-sm btn-danger" onclick="deleteStudent(${s.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Delete
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = currentStudents.length;
      const cseCount = currentStudents.filter(s => s.course && s.course.toUpperCase() === 'CSE').length;
      document.getElementById('stat-cse').textContent = cseCount;
      document.getElementById('stat-other').textContent = currentStudents.length - cseCount;
    }

    function handleSearch() {
      const val = document.getElementById('search-input').value;
      loadStudents(val);
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add New Student';
      document.getElementById('edit-id').value = '';
      document.getElementById('student-name').value = '';
      document.getElementById('student-course').value = '';
      document.getElementById('modal').style.display = 'flex';
      document.getElementById('student-name').focus();
    }

    function openEditModal(id) {
      const student = currentStudents.find(s => s.id === id);
      if (!student) return;
      document.getElementById('modal-title').textContent = 'Edit Student';
      document.getElementById('edit-id').value = student.id;
      document.getElementById('student-name').value = student.name;
      document.getElementById('student-course').value = student.course;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    async function saveStudent() {
      const editId = document.getElementById('edit-id').value;
      const name = document.getElementById('student-name').value.trim();
      const course = document.getElementById('student-course').value.trim();

      if (!name || !course) {
        showToast(' Name and course are required fields!', '#f59e0b');
        return;
      }

      try {
        if (editId) {
          // PUT /students/:id
          console.log(` [Client] Sending PUT request to ${API_BASE}/students/${editId}:`, { name, course });
          const res = await fetch(`${API_BASE}/students/${editId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, course })
          });
          if (!res.ok) throw new Error('Update failed');
          const updated = await res.json();
          console.log(` [Client] Server responded (200 OK):`, updated);
          showToast(`Student #${editId} updated! (Status 200 OK)`);
        } else {
          // POST /students
          console.log(` [Client] Sending POST request to ${API_BASE}/students:`, { name, course });
          const res = await fetch(`${API_BASE}/students`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, course })
          });
          if (!res.ok) throw new Error('Creation failed');
          const created = await res.json();
          console.log(`[Client] Server created student (201 Created):`, created);
          showToast(`Student created with ID #${created.id}! (Status 201 Created)`);
        }
        closeModal();
        loadStudents(document.getElementById('search-input').value);
      } catch (err) {
        console.error(' [Client] Error:', err);
        showToast(' Error communicating with API', '#ef4444');
      }
    }

    async function deleteStudent(id) {
      if (!confirm(`Are you sure you want to delete student #${id}?`)) return;
      try {
        console.log(` [Client] Sending DELETE request to ${API_BASE}/students/${id}`);
        const res = await fetch(`${API_BASE}/students/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete failed');
        const result = await res.json();
        console.log(` [Client] Server responded (200 OK):`, result);
        showToast(`Student #${id} deleted successfully! (Status 200 OK)`);
        loadStudents(document.getElementById('search-input').value);
      } catch (err) {
        console.error(' [Client] Error deleting student:', err);
        showToast(' Error deleting student', '#ef4444');
      }
    }

    function showToast(msg, color = '#10b981') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.style.borderColor = color;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Initial load
    loadStudents();
  </script>
</body>

</html>
